name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Evaluates and dry-builds both macOS profiles, so it needs a Mac runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Tools come from the locked nixpkgs so CI matches the configured Macs.
      # The Neovim smoke test needs installed plugins, so CI runs only lua-check.
      - name: Check flake, profiles, scripts, and Lua
        run: |
          nix shell --inputs-from . nixpkgs#ripgrep nixpkgs#shellcheck nixpkgs#stylua nixpkgs#lua \
            --command make runtime-check nix-check shell-check lua-check wezterm-check
