plugins:
  dive:
    shortCut: d
    confirm: false
    description: "Dive image"
    scopes:
      - containers
    command: dive
    background: false
    args:
      - $COL-IMAGE

  remove_finalizers:
    shortCut: Ctrl-F
    confirm: true
    dangerous: true
    scopes:
      - all
    description: |
      Removes all finalizers from selected resource. Be careful when using it,
      it may leave dangling resources or delete them
    command: kubectl
    background: true
    args:
      - patch
      - --context
      - $CONTEXT
      - --namespace
      - $NAMESPACE
      - $RESOURCE_NAME
      - $NAME
      - -p
      - '{"metadata":{"finalizers":null}}'
      - --type
      - merge
  argocd_apps:
    confirm: false
    description: ArgoCD app list for current cluster context
    scopes:
      - all
    command: kubectl
    background: false
    args:
      - --context
      - $CONTEXT
      - -n
      - argocd
      - get
      - applications.argoproj.io
      - -o
      - wide
  holmesgpt:
    confirm: false
    description: HolmesGPT investigate selected Kubernetes resource
    scopes:
      - all
    command: holmes
    background: false
    args:
      - ask
      - --no-interactive
      - Investigate Kubernetes resource $RESOURCE_NAME/$NAME in namespace $NAMESPACE on context $CONTEXT. Give likely root causes, checks to run, and remediation steps.
