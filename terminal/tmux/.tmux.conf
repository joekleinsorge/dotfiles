set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g renumber-windows on
set -g detach-on-destroy off
set -g base-index 1
setw -g pane-base-index 1

# Fast escape handling keeps Neovim mode changes responsive inside tmux.
set -sg escape-time 10

# Terminal capabilities for modern Neovim/WezTerm use.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB"
set -g set-clipboard external

# Vi-style copy mode with macOS clipboard integration.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Keep new windows and splits in the current pane's directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

# Pane movement and resizing.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Reload configuration.
bind-key -r r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Clean top status: tmux windows act as terminal tabs.
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=default,fg=colour245"
set -g status-left ""
set -g status-left-length 0
set -g status-right ""
set -g status-right-length 0
set -g status-justify left
set -g window-status-separator ""
set -g window-status-format " #[fg=colour245]#I:#W "
set -g window-status-current-format " #[fg=colour255,bold]#I:#W "
set -g window-status-current-style "bg=default,fg=colour255,bold"
